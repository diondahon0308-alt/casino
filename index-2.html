<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Casino</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎰</text></svg>">
<style>
:root{
  --felt:#0e3b2e; --felt2:#124a3a; --felt3:#0a2e24;
  --gold:#d9b24c; --gold-dim:#8a6d2b;
  --ink:#f3ecd9; --ink-dim:#a9baaf;
  --win:#5fb87a; --lose:#c85c4e;
  --line:#1e5a45;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --felt:#f4efe0; --felt2:#ffffff; --felt3:#e9e2ce;
    --ink:#1f2a24; --ink-dim:#5c6a61; --line:#ddd3b0;
  }
}
:root[data-theme="light"]{
  --felt:#f4efe0; --felt2:#ffffff; --felt3:#e9e2ce;
  --ink:#1f2a24; --ink-dim:#5c6a61; --line:#ddd3b0;
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{
  background:var(--felt3); color:var(--ink);
  font-family:Georgia,"Iowan Old Style",serif;
  min-height:100%; padding:18px 14px 50px;
}
.wrap{max-width:560px;margin:0 auto;}

header{text-align:center;margin-bottom:16px;}
header h1{font-size:1.6rem;margin:0 0 2px;letter-spacing:0.02em;color:var(--gold);font-weight:700;}
header p{margin:0;color:var(--ink-dim);font-size:0.8rem;}

.bank{
  background:var(--felt2); border:1px solid var(--gold-dim); border-radius:14px;
  padding:16px; display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;
}
.bank .amt{font-size:1.6rem; font-weight:700; color:var(--gold);}
.bank .lbl{font-size:0.7rem; color:var(--ink-dim); letter-spacing:0.03em;}
.tier-row{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:18px;}
.tier-btn{
  flex:1; min-width:58px; background:var(--felt2); border:1px solid var(--line); color:var(--ink-dim);
  border-radius:10px; padding:8px 4px; font-size:0.72rem; cursor:pointer; text-align:center; font-family:inherit;
}
.tier-btn.active{border-color:var(--gold); color:var(--gold); font-weight:700;}

.games-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:18px;}
.game-card{
  background:var(--felt2); border:1px solid var(--line); border-radius:12px; padding:14px 12px;
  cursor:pointer; text-align:left; font-family:inherit; color:var(--ink); position:relative;
}
.game-card.locked{opacity:0.4; cursor:not-allowed;}
.game-card .gname{font-weight:700; font-size:0.95rem; display:block; margin-bottom:3px;}
.game-card .gtier{font-size:0.68rem; color:var(--gold-dim);}
.game-card.active{border-color:var(--gold);}

.panel{
  background:var(--felt2); border:1px solid var(--gold-dim); border-radius:14px; padding:18px; margin-bottom:16px;
}
.panel h2{margin:0 0 4px; font-size:1.15rem; color:var(--gold);}
.panel .desc{color:var(--ink-dim); font-size:0.82rem; margin:0 0 14px; line-height:1.4;}
.row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; align-items:center;}
.row label{font-size:0.78rem; color:var(--ink-dim); min-width:80px;}
input[type=number], select{
  background:var(--felt3); border:1px solid var(--line); border-radius:8px; color:var(--ink);
  padding:8px 10px; font-family:inherit; font-size:0.9rem; flex:1; min-width:100px;
}
.choice-row{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px;}
.choice-btn{
  background:var(--felt3); border:1px solid var(--line); border-radius:8px; padding:8px 12px;
  color:var(--ink); cursor:pointer; font-family:inherit; font-size:0.85rem;
}
.choice-btn.sel{border-color:var(--gold); color:var(--gold); font-weight:700;}
.play-btn{
  width:100%; background:var(--gold); color:#20180a; border:none; border-radius:10px;
  padding:13px; font-weight:700; font-size:1rem; cursor:pointer; font-family:inherit; margin-top:6px;
}
.play-btn:disabled{opacity:0.4; cursor:not-allowed;}
.result{
  margin-top:14px; padding:12px; border-radius:10px; font-size:0.88rem; text-align:center; font-weight:700;
}
.result.win{background:rgba(95,184,122,0.15); color:var(--win); border:1px solid var(--win);}
.result.lose{background:rgba(200,92,78,0.15); color:var(--lose); border:1px solid var(--lose);}
.rocket-live{text-align:center; padding:10px 0;}
.rocket-mult{font-size:2.2rem; font-weight:700; color:var(--gold);}

.log-title{font-size:0.85rem; color:var(--ink-dim); margin:0 0 8px;}
.log-list{list-style:none; margin:0; padding:0;}
.log-list li{
  display:flex; justify-content:space-between; padding:8px 4px; border-bottom:1px solid var(--line); font-size:0.8rem;
}
.log-list li:last-child{border-bottom:none;}
.log-list .win-txt{color:var(--win);}
.log-list .lose-txt{color:var(--lose);}
.empty{color:var(--ink-dim); font-size:0.82rem;}

.reset{text-align:center; margin-top:22px;}
.reset button{
  background:none; border:1px solid var(--line); color:var(--ink-dim); border-radius:8px;
  padding:8px 14px; font-size:0.78rem; cursor:pointer; font-family:inherit;
}
.reset button.confirming{border-color:var(--lose); color:var(--lose);}
.status-banner{
  text-align:center; font-size:0.78rem; padding:7px; border-radius:8px; margin-bottom:12px;
  background:var(--felt2); border:1px solid var(--line); color:var(--ink-dim);
}
.status-banner.open{color:var(--win);}
.status-banner.closed{color:var(--lose);}
.mem-row{display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-bottom:6px;}
.mem-btn{
  background:var(--felt2); border:1px solid var(--line); color:var(--ink-dim); border-radius:10px;
  padding:8px 4px; font-size:0.68rem; cursor:pointer; text-align:center; font-family:inherit; line-height:1.4;
}
.mem-btn.active{border-color:var(--gold); color:var(--gold); font-weight:700;}
.mem-note{font-size:0.7rem; color:var(--ink-dim); text-align:center; margin:0 0 16px;}
.loan-warn{color:var(--lose); font-weight:700;}
.npc{display:flex; gap:10px; align-items:flex-start; background:var(--felt3); border:1px dashed var(--gold-dim);
  border-radius:12px; padding:10px 12px; margin-bottom:12px; cursor:pointer;}
.npc .face{font-size:1.5rem; line-height:1;}
.npc .nname{font-size:0.7rem; color:var(--gold); font-weight:700; letter-spacing:0.02em;}
.npc .nline{font-size:0.82rem; font-style:italic; margin-top:2px; line-height:1.4;}
.npc .nhint{font-size:0.62rem; color:var(--ink-dim); margin-top:3px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>♠ The Casino ♠</h1>
    <p>Button-based table games — no wheels, no graphics, just odds.</p>
  </header>

  <div class="status-banner" id="statusBanner"></div>

  <div class="bank">
    <div>
      <div class="lbl">BANK BALANCE</div>
      <div class="amt" id="balanceDisplay">$0</div>
    </div>
    <div style="text-align:right">
      <div class="lbl">MEMBERSHIP</div>
      <div class="amt" style="font-size:1.1rem" id="tierDisplay">Free Trial</div>
    </div>
  </div>

  <div id="treasurerBox"></div>
  <div class="mem-row" id="tierRow"></div>
  <p class="mem-note">Membership fee is a percentage of your balance, charged every 6 hours (4×/day), only on days the Casino is open.</p>

  <div class="panel" id="loanPanel"></div>

  <div class="panel" id="barPanel"></div>

  <div id="dealerBox"></div>
  <div class="games-grid" id="gamesGrid"></div>

  <div id="panelArea"></div>

  <div class="panel">
    <p class="log-title">Recent plays</p>
    <ul class="log-list" id="logList"><li class="empty">No games played yet.</li></ul>
  </div>

  <div class="panel" id="accountPanel"></div>

  <div class="reset"><button id="resetBtn">Reset bank &amp; progress</button></div>
  <div class="reset" style="margin-top:10px"><button id="adminToggleBtn">Admin Panel</button></div>
  <div id="adminPanelArea"></div>
</div>

<script>
(function(){
  const START_BALANCE = 25000;

  function freshState(){
    return { balance: START_BALANCE, membership:'free', log: [],
      lastChargeDay: null, casinoOpenDate: null, casinoOpenToday: true, loan: null,
      drunkenness: 0, luck: 0, lastEffectUpdate: Date.now(),
      cheatWin100: false, cheatUnlockAll: false,
      accountName: '', accountPassword: '' };
  }
  const KEY_REAL = "casino_state_v1";
  const KEY_DUMMY = "casino_state_admin_dummy_v1";
  let activeProfile = 'real';
  function keyFor(profile){ return profile === 'dummy' ? KEY_DUMMY : KEY_REAL; }
  function loadProfile(profile){
    try{
      const raw = localStorage.getItem(keyFor(profile));
      const s = raw ? JSON.parse(raw) : freshState();
      return Object.assign(freshState(), s);
    }catch(e){ return freshState(); }
  }
  function save(){ try{ localStorage.setItem(keyFor(activeProfile), JSON.stringify(state)); }catch(e){} }

  let state = loadProfile('real');
  let activeGame = null;

  const balanceEl = document.getElementById('balanceDisplay');
  const tierEl = document.getElementById('tierDisplay');
  const tierRowEl = document.getElementById('tierRow');
  const gridEl = document.getElementById('gamesGrid');
  const panelEl = document.getElementById('panelArea');
  const logEl = document.getElementById('logList');
  const statusEl = document.getElementById('statusBanner');
  const loanPanelEl = document.getElementById('loanPanel');
  const barPanelEl = document.getElementById('barPanel');
  const accountPanelEl = document.getElementById('accountPanel');
  let manualOpen = false;

  const fmt = n => (n<0?'-$':'$') + Math.abs(Math.round(n)).toLocaleString();

  const TIER_LABELS = {1:'I',2:'II',3:'III',4:'IV',5:'V',6:'VI',7:'VIP'};

  const FEE_INTERVAL_HOURS = 6; // how often membership fees are charged
  const MEMBERSHIPS = [
    { id:'free',  name:'Free Trial',  pct:0,  maxTier:1 },
    { id:'paid',  name:'Paid Trial',  pct:1,  maxTier:3 },
    { id:'pro',   name:'Pro Trial',   pct:2,  maxTier:4 },
    { id:'star',  name:'Star Trial',  pct:4,  maxTier:5 },
    { id:'royal', name:'Royal Trial', pct:6,  maxTier:6 },
    { id:'vip',   name:'VIP Trial',   pct:10, maxTier:7 },
  ];
  const currentMembership = () => MEMBERSHIPS.find(m => m.id === state.membership) || MEMBERSHIPS[0];
  const currentMaxTier = () => state.cheatUnlockAll ? 99 : currentMembership().maxTier;
  const isBankrupt = () => state.balance <= 0 && !state.cheatUnlockAll;

  function todayStr(){ return new Date().toISOString().slice(0,10); }

  function checkDailyEvents(){
    applyDecay();
    const today = todayStr();
    if(state.casinoOpenDate !== today){
      state.casinoOpenDate = today;
      state.casinoOpenToday = Math.random() < 0.7;
    }
    const periodKey = Math.floor(Date.now() / (FEE_INTERVAL_HOURS*3600*1000)).toString();
    if(state.casinoOpenToday && state.lastChargeDay !== periodKey){
      const fee = Math.round(state.balance * currentMembership().pct / 100);
      state.lastChargeDay = periodKey;
      if(fee > 0){
        state.balance = Math.max(0, state.balance - fee);
        pushLog(`${currentMembership().name} fee charged (every ${FEE_INTERVAL_HOURS}h): -${fmt(fee)}`, false);
      }
    }
    if(state.loan){
      const daysElapsed = (Date.now() - state.loan.takenAt) / 86400000;
      if(daysElapsed > 3){
        pushLog(`The Loan Sharks caught up with you — ${fmt(state.loan.amount)} unpaid. Balance wiped.`, false);
        state.balance = 0;
        state.loan = null;
      }
    }
    save();
  }

  const GAMES = [
    { id:'don', name:'Double or Nothing', tier:1, fee:0, maxTakeout:100000,
      desc:'A straight 50/50. Double your bet, or lose it all.', maxBet:50000,
      render: renderSimpleBet, play: playDoubleOrNothing },
    { id:'cardroulette', name:'Card Roulette', tier:1, fee:0, maxTakeout:75000,
      desc:'Guess the suit and/or value of the drawn card (♠ ♥ ♦ ♣, 1–30).', maxBet:30000,
      render: renderCardRoulette, play: playCardRoulette },
    { id:'hilo', name:'HiLo', tier:2, fee:10, maxTakeout:300000,
      desc:'A number 0–100 is drawn. Guess whether the next one goes up or down.', maxBet:100000,
      render: renderHiLo, play: playHiLo },
    { id:'rocket', name:'Rocket Ship', tier:2, fee:10, maxTakeout:500000,
      desc:'The multiplier climbs each second. Cash out before it crashes — 80% chance to survive each second.', maxBet:100000,
      render: renderRocket, play: null },
    { id:'roulette', name:'Roulette', tier:3, fee:20, maxTakeout:500000,
      desc:'Guess the color (red/black/green) and/or value (1–30). Green pays the Dealer.', maxBet:100000,
      render: renderRoulette, play: playRoulette },
    { id:'slots', name:'Slots', tier:3, fee:'5% of balance', maxTakeout:null,
      desc:'Three reels, five symbols. Match all three for a payout. Costs 5% of your balance per spin.', maxBet:0,
      render: renderSlots, play: playSlots },
    { id:'blackjack', name:'Blackjack', tier:3, fee:10, maxTakeout:400000,
      desc:'Hit, Double, or Stand — then the Dealer plays their own hand by simple rules. Closest to 21 without busting wins.', maxBet:100000,
      render: renderBlackjack, play: null },
    { id:'lottery', name:'Fortune Lottery', tier:4, fee:25, maxTakeout:750000,
      desc:'Pick exact, short-range, or long-range odds. It\u2019s a 1% shot no matter what — but the payout scales with how precise you were.', maxBet:150000,
      render: renderLottery, play: null },
    { id:'buddyrace', name:'Buddy Race', tier:4, fee:10, maxTakeout:null,
      desc:'Pick one of 5 Buddies. Equal odds, winner takes the pot.', maxBet:0,
      render: renderBuddyRace, play: null },
    { id:'cointoss', name:'Coin Toss', tier:5, fee:10, maxTakeout:750000,
      desc:'Heads or Tails. Guess right and win 3× your bet on top of keeping it, wrong loses it all.', maxBet:250000,
      render: renderCoinToss, play: null },
    { id:'russianroulette', name:'Russian Roulette', tier:5, fee:25, maxTakeout:1250000,
      desc:'You and the Dealer share one revolver, 1 bullet in 6 chambers. Shoot yourself for the bigger multiplier, or let the Dealer take the shot at you for a safer one. Odds worsen as the cylinder empties.', maxBet:250000,
      render: renderRussianRoulette, play: null },
    { id:'plinko', name:'Plinko', tier:4, fee:20, maxTakeout:500000,
      desc:'Drop the ball through the pins — 10 possible landing slots from 0.25× up to 5×.', maxBet:100000,
      render: renderPlinko, play: null },
    { id:'rochambo', name:'Rochambo', tier:7, fee:50, maxTakeout:2500000,
      desc:'Rock, Paper, Scissors against the Dealer. VIP only.', maxBet:1250000,
      render: renderRochambo, play: null },
    { id:'squidgames', name:'Squid Games', tier:7, fee:50, maxTakeout:3000000,
      desc:'Push through 6 rounds or cash out between them. Get eliminated and you lose everything. VIP only.', maxBet:375000,
      render: renderSquidGames, play: null },
  ];

    // --- NPCs ---
  const NPCS = {
    bartender: { name:'Marlo, the Bartender', icon:'🍸' },
    loanshark: { name:'Big Tony, the Loan Shark', icon:'🦈' },
    dealer:    { name:'Ace, the Dealer', icon:'🎩' },
    treasurer: { name:'Ms. Goldfield, the Treasurer', icon:'💼' },
  };
  const npcCurrent = {}, npcPools = {};
  function npcBox(id, pool){
    npcPools[id] = pool;
    if(!pool.includes(npcCurrent[id])) npcCurrent[id] = pool[Math.floor(Math.random()*pool.length)];
    const n = NPCS[id];
    return `<div class="npc" data-npc="${id}"><span class="face">${n.icon}</span><div>
      <div class="nname">${n.name}</div><div class="nline">\u201C${npcCurrent[id]}\u201D</div>
      <div class="nhint">tap to hear something else</div></div></div>`;
  }
  document.addEventListener('click', e => {
    const el = e.target.closest ? e.target.closest('.npc') : null;
    if(!el) return;
    const id = el.dataset.npc, pool = npcPools[id];
    if(!pool || pool.length < 2) return;
    let next;
    do { next = pool[Math.floor(Math.random()*pool.length)]; } while(next === npcCurrent[id]);
    npcCurrent[id] = next;
    el.querySelector('.nline').textContent = '\u201C' + next + '\u201D';
  });

  function bartenderPool(){
    if(isBankrupt()) return [
      "No cash, no cocktails, friend. Big Tony's over there if you're desperate.",
      "I'd pour you one on the house, but I don't have one. Get some funds first.",
    ];
    if(currentMaxTier() < 3) return [
      "Bar's for Paid Trial members and up. Upgrade and the first round is calling your name.",
      "You look thirsty. A Paid Trial membership fixes that.",
      "Members only back here. Talk to the Treasurer and come thirsty.",
    ];
    if(state.drunkenness >= 60) return [
      "Easy there, champ. Maybe a Cleanser before you hit the tables?",
      "You're swaying a little. The Cleanser's only $300 if you want to sober up.",
    ];
    return [
      "Welcome in! A drink or two never hurt a lucky streak.",
      "Shamrock Shake's a house favorite. A little luck goes a long way at the tables.",
      "Feeling unlucky? Have a Beer. Feeling too lucky? That's what the Cleanser is for.",
      "Loosen up a little. Some games love a slightly tipsy player.",
      "Vodka and Supershots are for the serious players. Tier IV and up.",
      "Everything's priced to keep you spinning. Tab's always open.",
    ];
  }
  function loansharkPool(){
    if(state.loan){
      const daysLeft = 3 - (Date.now() - state.loan.takenAt) / 86400000;
      if(daysLeft < 1) return [
        "Time's almost up. Repay now, or I wipe you clean.",
        "You hear that ticking? That's your last few hours.",
        "I don't like doing this. Actually, I do. Pay up.",
      ];
      return [
        "Tick tock. Your loan won't repay itself.",
        "I like you, kid. That's why I'm reminding you: pay what you owe.",
        "Three days. That's the deal. Don't make me come find you.",
        "Interest-free, sure. But my patience? That costs extra.",
        "Every day you wait is a day closer to me cleaning out your pockets.",
      ];
    }
    if(isBankrupt()) return [
      "Look at you. Zero bucks. Take a loan and get back in the game. I'll be watching.",
      "Broke? Everybody's broke sometime. I can fix that. Temporarily.",
    ];
    return [
      "Need some cash? I'm always open. Just remember the three-day rule.",
      "A little loan never hurt anybody. Not for the first three days anyway.",
      "Big bets need big bankrolls. I can help with that.",
      "No forms, no questions, just a deadline. Interested?",
    ];
  }
  function dealerPool(){
    if(isBankrupt()) return [
      "Can't deal you in with empty pockets. Go see the loan guy.",
      "No chips, no seat. Come back with some cash.",
    ];
    if(!state.casinoOpenToday) return [
      "We're closed today, friend. The tables will be here tomorrow.",
      "Lights are off. Come back when we're open.",
    ];
    return [
      "Step right up. Blackjack's got a seat with your name on it.",
      "Rocket Ship's climbing. Got the nerve to ride it?",
      "Coin Toss: call it right and walk away with triple.",
      "Plinko's warm tonight. The ball's got a good feeling.",
      "I play fair. The odds just lean my way a little.",
      "Higher tiers, bigger tables. Squid Games and Rochambo wait for VIPs.",
      "Russian Roulette? Bold. I like bold. Bring a fat wallet.",
      "Slots are cheap and shiny. Three matching symbols and you're in business.",
    ];
  }
  function treasurerPool(){
    const idx = MEMBERSHIPS.findIndex(m => m.id === state.membership);
    const next = MEMBERSHIPS[idx+1];
    if(isBankrupt()) return [
      "Memberships cost money, dear, and you have none. Sort out your bank first.",
      "Fees still apply at zero. Take care of your balance and we'll talk upgrades.",
    ];
    const base = [
      "Higher tiers open bigger tables and bigger payouts. Invest in yourself.",
      "Fees are small, winnings are big. Upgrade and watch your bank grow.",
      "Every Trial upgrade unlocks games the free members only dream about.",
    ];
    if(!next) return [
      "VIP Trial, the top of the mountain. Every game is open to you.",
      "You're already at the top. I have nothing left to sell you. Enjoy.",
    ].concat(base.slice(0,1));
    return base.concat([
      `Upgrade to ${next.name} for ${next.pct}% of your balance every ${FEE_INTERVAL_HOURS} hours and unlock Tier ${TIER_LABELS[next.maxTier]}.`,
      idx === 0 ? "Free Trial is fine for a start, but real players hold a membership."
                : `Still on ${currentMembership().name}? ${next.name} has tables you're missing out on.`,
    ]);
  }

  function renderTiers(){
    renderTiersInner();
    document.getElementById('treasurerBox').innerHTML = npcBox('treasurer', treasurerPool());
  }
  function renderLoanPanel(){
    renderLoanInner();
    loanPanelEl.insertAdjacentHTML('afterbegin', npcBox('loanshark', loansharkPool()));
  }
  function renderBar(){
    renderBarInner();
    barPanelEl.insertAdjacentHTML('afterbegin', npcBox('bartender', bartenderPool()));
  }
  function renderGrid(){
    document.getElementById('dealerBox').innerHTML = npcBox('dealer', dealerPool());
    renderGridInner();
  }

  function renderTiersInner(){
    tierRowEl.innerHTML = '';
    MEMBERSHIPS.forEach(m => {
      const b = document.createElement('button');
      b.className = 'mem-btn' + (state.membership === m.id ? ' active' : '');
      b.innerHTML = `${m.name}<br>${m.pct === 0 ? 'free' : m.pct + '%/' + FEE_INTERVAL_HOURS + 'h'}`;
      b.addEventListener('click', () => { state.membership = m.id; save(); renderAll(); });
      tierRowEl.appendChild(b);
    });
    tierEl.textContent = currentMembership().name;
  }

  function renderStatus(){
    statusEl.className = 'status-banner ' + (isBankrupt() ? 'closed' : (state.casinoOpenToday ? 'open' : 'closed'));
    if(isBankrupt()){
      statusEl.textContent = (activeProfile === 'dummy' ? '[ADMIN — Dummy Player] ' : '') + '💀 BANKRUPT — you have $0. Take a loan below to keep playing.';
      return;
    }
    statusEl.textContent = (activeProfile === 'dummy' ? '[ADMIN — Dummy Player] ' : '') + (state.casinoOpenToday
      ? '🟢 The Casino is OPEN today'
      : '🔴 The Casino is CLOSED today — games unavailable, no membership charge');
  }

  function renderLoanInner(){
    if(state.loan){
      const daysLeft = Math.max(0, 3 - (Date.now() - state.loan.takenAt) / 86400000);
      const hrs = Math.floor((daysLeft % 1) * 24);
      loanPanelEl.innerHTML = `
        <h2 style="margin:0 0 8px;font-size:1rem;color:var(--gold)">Bank Loan</h2>
        <p class="desc" style="margin:0 0 10px">You owe <b>${fmt(state.loan.amount)}</b>.

    const now = Date.now();

    const mins = Math.floor((now - last) / 60000);
    if(mins > 0){

      state.luck = Math.max(0, state.luck - mins);

  function settle(net, fee, resultEl, winText, loseText){
    if(state.cheatWin100 && net <= 0){
      net = Math.abs(net) || fee || 1000;
      winText = winText || 'Cheat: forced win';
    }
    state.balance = Math.max(0, state.balance - fee + net);
    save();
    const positive = net > 0;
    resultEl.innerHTML = `<div class="result ${positive ? 'win' : 'lose'}">${positive ? winText : loseText}</div>`;
    pushLog(`${positive ? winText : loseText}`, positive);
    renderBalance();

  function getBet(maxBet){

    if(!bet || bet <= 0) return null;
    if(bet > state.balance) bet = state.balance;
    if(maxBet && bet > maxBet) bet = maxBet;
    return bet;
  }

  // --- Rocket Ship ---
  function multForSeconds(s){
    if(s<5) return 1;
    if(s<14) return 1.5;
    if(s<19) return 2;
    if(s<25) return 2.5;
    if(s<31) return 3;
    if(s<41) return 3.5;
    if(s<51) return 4;
    return 5;
  }
  function renderRocket(g, body, resultEl){
    betInput(body, g.maxBet);
    body.innerHTML += `<button class="play-btn" id="startBtn">Launch</button>
      <div class="rocket-live" id="rocketLive" style="display:none">
        <div class="rocket-mult" id="rocketMultDisp">1.0×</div>
        <p style="color:var(--ink-dim);font-size:0.8rem;margin:4px 0 12px">seconds elapsed: <span id="rocketSecs">0</span></p>
        <button class="play-btn" id="cashOutBtn">Cash Out</button>
      </div>`;
    document.getElementById('startBtn').addEventListener('click', () => {
      const bet = getBet(g.maxBet);
      if(!bet) return;
      const fee = Math.round(bet * 0.10);
      document.getElementById('startBtn').style.display = 'none';
      document.getElementById('betInput').disabled = true;
      document.getElementById('rocketLive').style.display = 'block';
      let secs = 0, crashed = false, cashedOut = false;
      const multDisp = document.getElementById('rocketMultDisp');
      const secsDisp = document.getElementById('rocketSecs');
      const cashBtn = document.getElementById('cashOutBtn');
      const timer = setInterval(() => {
        secs++;
        if(secs > 60 || Math.random() < Math.max(0.02, 0.2 - winBonus())){
          crashed = true;
          clearInterval(timer);
          if(!cashedOut){
            settle(-bet, fee, resultEl, '', `Rocket crashed at ${secs}s — lost ${fmt(bet)}`);
            cashBtn.disabled = true;
          }
          return;
        }
        const mult = multForSeconds(secs);
        multDisp.textContent = mult.toFixed(1) + '×';
        secsDisp.textContent = secs;
      }, 1000);
      cashBtn.addEventListener('click', () => {
        if(crashed || cashedOut) return;
        cashedOut = true;
        clearInterval(timer);
        const mult = multForSeconds(secs);
        const net = bet*(mult-1);
        settle(net, fee, resultEl, `Cashed out at ${mult.toFixed(1)}× (${secs}s) — won ${fmt(net)}`, '');
        cashBtn.disabled = true;
      }, { once:true });
    });
  }

  // --- Slots ---
  const SLOT_SYMS = [
    { s:'🌶', w:25 }, { s:'💎', w:15 }, { s:'🎯', w:25 }, { s:'🃏', w:30 }, { s:'🎰', w:5 }
  ];
  function weightedSlot(){
    const total = SLOT_SYMS.reduce((a,b)=>a+b.w,0);
    let r = Math.random()*total;
    for(const item of SLOT_SYMS){ if(r < item.w) return item.s; r -= item.w; }
    return SLOT_SYMS[0].s;
  }

        `${reels.join(' ')} — no match, paid ${fmt(fee)} to play`);
    });
  }

  });

  // --- Blackjack ---
  const BJ_TABLE = [[20,99,4],[19,19,3.5],[18,18,3],[15,17,2.5],[11,14,2],[6,10,1.5],[0,5,1]];
  function bjMultFor(v){ for(const [lo,hi,m] of BJ_TABLE){ if(v>=lo && v<=hi) return m; } return 1; }
  function houseDraw(){ return Math.floor(Math.random()*10) + 1; }
  function playHouseHand(){
    // Simple threshold AI: catches up fast when far behind, stops once safe.
    let total = 0, rounds = 0;
    while(rounds < 12){
      rounds++;
      if(total < 12) total += houseDraw() + houseDraw(); // behind — double up
      else if(total < 17) total += houseDraw(); // still short — hit
      else break; // safe enough — stand
      if(total > 21) break;
    }
    return total;
  }
  function renderBlackjack(g, body, resultEl){
    betInput(body, g.maxBet);
    body.innerHTML += `<button class="play-btn" id="startBtn">Deal</button>
      <div id="bjLive" style="display:none;margin-top:12px">
        <p style="text-align:center;font-size:0.75rem;color:var(--ink-dim);margin:0 0 4px">Your hand</p>
        <p style="text-align:center;font-size:1.6rem;color:var(--gold);margin:0 0 10px" id="bjTotal">0</p>
        <div class="choice-row" style="justify-content:center" id="bjBtns"></div>
      </div>`;
    document.getElementById('startBtn').addEventListener('click', () => {
      const bet = getBet(g.maxBet);
      if(!bet) return;
      const fee = Math.round(bet * 0.10);
      document.getElementById('startBtn').style.display = 'none';
      document.getElementById('betInput').disabled = true;
      document.getElementById('bjLive').style.display = 'block';
      let total = 0, done = false;
      const totalEl = document.getElementById('bjTotal');
      const btnsEl = document.getElementById('bjBtns');
      function renderBtns(){
        btnsEl.innerHTML = '';
        ['Hit','Double','Stand'].forEach(action => {
          const b = document.createElement('button');
          b.className = 'choice-btn'; b.textContent = action;
          b.addEventListener('click', () => handle(action));
          btnsEl.appendChild(b);
        });
      }
      function resolve(){
        done = true; btnsEl.innerHTML = '';
        if(total > 21){
          settle(-bet, fee, resultEl, '', `You busted at ${total} — lost ${fmt(bet)}`);
          return;
        }
        const houseTotal = playHouseHand();
        if(houseTotal > 21){
          const mult = bjMultFor(total);
          const net = bet*(mult-1);
          settle(net, fee, resultEl, `You: ${total} — Dealer busted at ${houseTotal} — won ${fmt(net)}`, '');
        } else if(total > houseTotal){
          const mult = bjMultFor(total);
          const net = bet*(mult-1);
          settle(net, fee, resultEl, `You: ${total} vs Dealer: ${houseTotal} — won ${fmt(net)}`, '');
        } else if(total === houseTotal){
          settle(0, fee, resultEl, `Push at ${total} — bet returned`, `Push at ${total} — bet returned`);
        } else {
          settle(-bet, fee, resultEl, '', `You: ${total} vs Dealer: ${houseTotal} — lost ${fmt(bet)}`);
        }
      }
      function handle(action){
        if(done) return;
        if(action === 'Hit') total += houseDraw();
        else if(action === 'Double') total += houseDraw() + houseDraw();
        else if(action === 'Stand'){ resolve(); return; }
        totalEl.textContent = total;
        if(total > 21) resolve();
      }
      renderBtns();
    });
  }

  // --- Squid Games ---
  const SQUID_MULTS = [1.5, 1.75, 2, 3.5, 5, 8];
  const SQUID_SURVIVE = [0.85, 0.75, 0.65, 0.55, 0.45, 0.35];
  function renderSquidGames(g, body, resultEl){
    betInput(body, g.maxBet);
    body.innerHTML += `<button class="play-btn" id="startBtn">Enter the Games</button>
      <div id="squidLive" style="display:none;margin-top:12px">

        <div class="choice-row" style="justify-content:center" id="squidBtns"></div>

    document.getElementById('startBtn').addEventListener('click', () => {

      const fee = Math.round(bet * 0.50);

      document.getElementById('squidLive').style.display = 'block';

      function playRound(){
        statusDisp.textContent = round === 0
          ? 'Ready to enter Game 1.'
          : `Survived Game ${round} — current cash-out: ${SQUID_MULTS[round-1].toFixed(2)}×`;

        const pushBtn = document.createElement('button');
        pushBtn.className = 'choice-btn';
        pushBtn.textContent = round === 0 ? 'Start Game 1' : `Push to Game ${round+1}`;

          if(!survived){
            settle(-bet, fee, resultEl, '', `Eliminated in Game ${round+1} — lost ${fmt(bet)}`);
            btnsEl.innerHTML = ''; statusDisp.textContent = 'Eliminated.';
            return;
          }
          round++;
          if(round >= 6){
            const net = bet*(SQUID_MULTS[5]-1);
            settle(net, fee, resultEl, `Survived all 6 Games — won ${fmt(net)}`, '');
            btnsEl.innerHTML = ''; statusDisp.textContent = 'Survived every game!';
            return;
          }
          playRound();
        });
        btnsEl.appendChild(pushBtn);
        if(round > 0){
          const cashBtn = document.createElement('button');
          cashBtn.className = 'choice-btn';
          cashBtn.textContent = `Cash Out (${SQUID_MULTS[round-1].toFixed(2)}×)`;
          cashBtn.addEventListener('click', () => {
            const net = bet*(SQUID_MULTS[round-1]-1);
            settle(net, fee, resultEl, `Cashed out after Game ${round} — won ${fmt(net)}`, '');
            btnsEl.innerHTML = ''; statusDisp.textContent = 'Cashed out.';
          });
          btnsEl.appendChild(cashBtn);
        }
      }
      playRound();
    });
  }

  // --- Account / encrypted export-import ---
  const CRYPTO_SALT = "casino-export-salt-v1";
  async function deriveKey(name, pass){
    const enc = new TextEncoder();
    const material = await crypto.subtle.digest('SHA-256', enc.encode(CRYPTO_SALT + '::' + name + '::' + pass));
    return crypto.subtle.importKey('raw', material, {name:'AES-GCM'}, false, ['encrypt','decrypt']);
  }
  async function exportPayload(name, pass){
    const payload = { v:1, membership: state.membership, balance: state.balance,
      drunkenness: state.drunkenness, luck: state.luck, loan: state.loan };
    const key = await deriveKey(name, pass);
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const data = new TextEncoder().encode(JSON.stringify(payload));
    const cipher = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, data);
    const combined = new Uint8Array(iv.length + cipher.byteLength);
    combined.set(iv, 0); combined.set(new Uint8Array(cipher), iv.length);
    let binary = ''; combined.forEach(b => binary += String.fromCharCode(b));
    return btoa(binary);
  }
  async function importPayload(str, name, pass){
    const key = await deriveKey(name, pass);
    const binary = atob(str.trim());
    const bytes = new Uint8Array(binary.length);
    for(let i=0;i<binary.length;i++) bytes[i] = binary.charCodeAt(i);
    const iv = bytes.slice(0,12), data = bytes.slice(12);
    const plainBuf = await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, data);
    return JSON.parse(new TextDecoder().decode(plainBuf));
  }
  const MANUAL_HTML = `

    <b>Export</b> — fill in Name + Password, tap Export My Data. You get a scrambled code holding your Membership Tier, Balance, and other stats (drunkenness, luck, loan status). Copy it somewhere safe — notes app, message to yourself, etc.<br><br>
    <b>Import</b> — paste a previously exported code into the Import box, enter the <i>exact</i> Name and Password used when it was created, tap Import Data. If they match, your stats are restored. If either is wrong, the code will not decrypt — there's no recovery, so don't forget them.<br><br>
    This moves data between sessions of this same app (e.g. after clearing your browser or on another device) — it doesn't sync automatically and isn't a real online account.`;
  function showAcctMsg(text, ok){
    const el = document.getElementById('acctMsg');

  function renderAccount(){

      <h2 style="margin:0 0 8px;font-size:1rem;color:var(--gold)">Account &amp; Data</h2>
      <p class="desc" style="margin:0 0 10px">Optional. Not a real login — a Name + Password used to lock your exported save.</p>
      <div class="row"><label>Name</label><input type="text" id="acctName" value="${(state.accountName||'').replace(/"/g,'&quot;')}"></div>

      <button class="play-btn" id="exportBtn">Export My Data</button>
      <textarea id="exportOut" readonly rows="3" style="width:100%;margin-top:10px;display:none;background:var(--felt3);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px;font-family:monospace;font-size:0.68rem"></textarea>

      <button class="play-btn" id="importBtn" style="margin-top:10px">Import Data</button>
      <p id="acctMsg" style="font-size:0.78rem;margin-top:8px;display:none"></p>

      <button class="play-btn" id="manualToggleBtn" style="margin-top:18px;background:none;border:1px solid var(--line);color:var(--ink-dim)">${manualOpen ? 'Hide Manual' : 'Show Manual'}</button>
      <div id="manualBody" style="display:${manualOpen ? 'block' : 'none'};margin-top:12px;font-size:0.8rem;color:var(--ink-dim);line-height:1.6">${manualOpen ? MANUAL_HTML : ''}</div>
    `;
    document.getElementById('acctSaveBtn').addEventListener('click', () => {
      state.accountName = document.getElementById('acctName').value.trim();
      state.accountPassword = document.getElementById('acctPass').value;
      save();
      showAcctMsg('Account info saved.', true);
    });
    document.getElementById('exportBtn').addEventListener('click', async () => {
      const name = document.getElementById('acctName').value.trim();
      const pass = document.getElementById('acctPass').value;
      if(!name || !pass){ showAcctMsg('Enter a Name and Password first.', false); return; }
      try{
        const code = await exportPayload(name, pass);
        const out = document.getElementById('exportOut');
        out.value = code; out.style.display = 'block'; out.focus(); out.select();
        showAcctMsg('Exported — copy the code above. You\u2019ll need this exact Name and Password to import it later.', true);
      }catch(e){ showAcctMsg('Export failed on this device.', false); }
    });
    document.getElementById('importBtn').addEventListener('click', async () => {
      const name = document.getElementById('acctName').value.trim();
      const pass = document.getElementById('acctPass').value;
      const code = document.getElementById('importIn').value;
      if(!name || !pass || !code.trim()){ showAcctMsg('Enter Name, Password, and the exported code.', false); return; }
      try{
        const payload = await importPayload(code, name, pass);
        state.membership = payload.membership;
        state.balance = payload.balance;
        state.drunkenness = payload.drunkenness;
        state.luck = payload.luck;
        state.loan = payload.loan;
        state.accountName = name; state.accountPassword = pass;
        save(); renderAll();
        showAcctMsg('Import successful — data restored.', true);
      }catch(e){ showAcctMsg('Import failed — wrong Name/Password, or invalid code.', false); }
    });
    document.getElementById('manualToggleBtn').addEventListener('click', () => {
      manualOpen = !manualOpen;
      renderAccount();
    });
  }

  // --- Coin Toss ---
  function renderCoinToss(g, body, resultEl){
    betInput(body, g.maxBet);
    body.innerHTML += `<div class="choice-row" id="ctRow"></div><button class="play-btn" id="playBtn" disabled>Flip</button>`;
    let picked = null;
    const row = document.getElementById('ctRow');
    ['Heads','Tails'].forEach(c => {
      const b = document.createElement('button');
      b.className = 'choice-btn'; b.textContent = c;
      b.addEventListener('click', () => {
        picked = c;
        [...row.children].forEach(x => x.classList.remove('sel'));
        b.classList.add('sel');
        document.getElementById('playBtn').disabled = false;
      });
      row.appendChild(b);
    });
    document.getElementById('playBtn').addEventListener('click', () => {
      const bet = getBet(g.maxBet);
      if(!bet || !picked) return;
      const fee = Math.round(bet * 0.10);
      const result = Math.random() < 0.5 ? 'Heads' : 'Tails';
      const win = result === picked;
      const net = win ? bet*3 : -bet;
      settle(net, fee, resultEl,
        `Landed ${result} — won ${fmt(net)}`,
        `Landed ${result} — lost ${fmt(bet)}`);
    });
  }

  // --- Russian Roulette ---
  function renderRussianRoulette(g, body, resultEl){
    betInput(body, g.maxBet);
    body.innerHTML += `<p style="color:var(--ink-dim);font-size:0.78rem;margin:0 0 10px" id="rrChamber">Fresh cylinder loaded — 1 bullet, 6 chambers.</p>
      <div class="choice-row">
        <button class="choice-btn" id="rrSelfBtn">Shoot Yourself (survive 5× / hit 0.5×)</button>
        <button class="choice-btn" id="rrOtherBtn">Dealer Shoots You (survive 3× / hit 0.75×)</button>
      </div>`;
    let bulletIndex = Math.floor(Math.random()*6), pos = 0;
    const chamberEl = document.getElementById('rrChamber');
    function updateChamberText(){
      const remaining = 6 - pos;
      chamberEl.textContent = `${remaining} chamber${remaining===1?'':'s'} left before this cylinder reloads — odds get worse as it empties.`;
    }
    function pull(mode){
      const bet = getBet(g.maxBet);
      if(!bet) return;
      const fee = Math.round(bet * 0.25);
      const hit = pos === bulletIndex;
      pos++;
      if(pos >= 6){ bulletIndex = Math.floor(Math.random()*6); pos = 0; }
      updateChamberText();
      const mult = mode === 'self' ? (hit ? 0.5 : 5) : (hit ? 0.75 : 3);
      const net = bet*(mult-1);
      const tag = mode === 'self' ? 'self-shot' : 'Dealer\'s shot';
      settle(net, fee, resultEl,
        `Click — survived (${tag}) — won ${fmt(net)}`,
        `Bang — hit (${tag}) — lost ${fmt(-net)}`);
    }
    document.getElementById('rrSelfBtn').addEventListener('click', () => pull('self'));
    document.getElementById('rrOtherBtn').addEventListener('click', () => pull('other'));
  }

  // --- Plinko ---
  const PLINKO_SLOTS = [0.25, 0.5, 0.75, 1, 1.5, 2, 2.5, 3, 4, 5];
  const PLINKO_WEIGHTS = [20, 15, 15, 10, 10, 10, 5, 5, 5, 5];
  function renderPlinko(g, body, resultEl){
    betInput(body, g.maxBet);
    body.innerHTML += `<p style="color:var(--ink-dim);font-size:0.78rem;margin:0 0 10px">Slots: 0.25× 0.5× 0.75× 1× 1.5× 2× 2.5× 3× 4× 5×</p><button class="play-btn" id="playBtn">Drop Ball</button>`;
    document.getElementById('playBtn').addEventListener('click', () => {
      const bet = getBet(g.maxBet);
      if(!bet) return;
      const fee = Math.round(bet * 0.20);
      const total = PLINKO_WEIGHTS.reduce((a,b) => a+b, 0);
      let r = Math.random()*total, idx = 0;
      for(let i=0;i<PLINKO_WEIGHTS.length;i++){ if(r < PLINKO_WEIGHTS[i]){ idx = i; break; } r -= PLINKO_WEIGHTS[i]; }
      const mult = PLINKO_SLOTS[idx];
      const net = bet*(mult-1);
      settle(net, fee, resultEl,
        `Landed in the ${mult}× slot — won ${fmt(net)}`,
        `Landed in the ${mult}× slot — lost ${fmt(-net)}`);
    });
  }

      <button class="play-btn" id="switchProfileBtn">${activeProfile === 'dummy' ? 'Switch to Real Player' : 'Switch to Dummy Player'}</button>

      <p class="desc" style="margin:16px 0 8px">Cheats (apply to whichever player is active above)</p>
      <button class="play-btn" id="cheatWinBtn" style="margin-top:0;background:${state.cheatWin100?'var(--gold)':'var(--felt3)'};color:${state.cheatWin100?'#20180a':'var(--ink)'};border:1px solid var(--line)">100% Win Mode: ${state.cheatWin100 ? 'ON' : 'OFF'}</button>
      <button class="play-btn" id="cheatUnlockBtn" style="margin-top:8px;background:${state.cheatUnlockAll?'var(--gold)':'var(--felt3)'};color:${state.cheatUnlockAll?'#20180a':'var(--ink)'};border:1px solid var(--line)">Unlock All Games: ${state.cheatUnlockAll ? 'ON' : 'OFF'}</button>

    document.getElementById('switchProfileBtn').addEventListener('click', () => {

    document.getElementById('cheatWinBtn').addEventListener('click', () => {

    document.getElementById('cheatUnlockBtn').addEventListener('click', () => {
      state.cheatUnlockAll = !state.cheatUnlockAll; save(); renderAll(); renderAdminArea();
    });
    document.getElementById('cheatMoneyBtn').addEventListener('click', () => {
      state.balance = 999999999; save(); renderBalance();
    });
    document.getElementById('testLoanSharkBtn').addEventListener('click', () => {
      if(!state.loan){
        state.loan = { amount: 10000, takenAt: Date.now() - 4*86400000 };
      } else {
        state.loan.takenAt = Date.now() - 4*86400000;
      }
      checkDailyEvents();
      save(); renderAll(); renderAdminArea();
    });
    document.getElementById('testBankruptBtn').addEventListener('click', () => {
      state.balance = 0; save(); renderAll();
    });
    document.getElementById('testChargeBtn').addEventListener('click', () => {
      state.lastChargeDay = null;
      checkDailyEvents();
      save(); renderAll();
    });
    document.getElementById('testOpenBtn').addEventListener('click', () => {
      state.casinoOpenDate = todayStr(); state.casinoOpenToday = true; save(); renderAll();
    });
    document.getElementById('testClosedBtn').addEventListener('click', () => {
      state.casinoOpenDate = todayStr(); state.casinoOpenToday = false; save(); renderAll();

    document.getElementById('adminLogoutBtn').addEventListener('click', () => {
      adminUnlocked = false; adminLoginOpen = false;
      if(activeProfile === 'dummy'){
        activeProfile = 'real';
        state = loadProfile('real');
        checkDailyEvents();
        activeGame = null;
        renderAll();
      }
      renderAdminArea();
    });
  }
  document.getElementById('adminToggleBtn').addEventListener('click', () => {
    adminLoginOpen = !adminLoginOpen;
    renderAdminArea();
  });

  checkDailyEvents();
  renderAll();
})();
